 branches: - main jobs: build: runs-on: ubuntu-latest steps: - name: Checkout repo uses: actions/checkout@v4 - name: Setup Node uses: actions/setup-node@v4 with: node-version: 20.x - name: Expo GitHub Action uses: expo/expo-github-action@9.0.0 with: eas-version: latest token: ${{ secrets.EXPO_TOKEN }} - name: Install dependencies run: yarn install - name: Build app run: eas build --platform android --profile preview --non-interactive
